version: 1

websocket_bot:
  enabled: true
  app_id_env: FEISHU_APP_ID
  app_secret_env: FEISHU_APP_SECRET
  transport: websocket
  commands:
    - /help
    - /ping
    - /daily
    - /weekly
    - /health
    - /review
    - /decide <index> study|ignore|keep|merge
    - /run daily
    - /run weekly
